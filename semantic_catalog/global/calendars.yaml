timezone: America/Lima
relative_periods:
  today_start: (TIMEZONE('America/Lima', CURRENT_TIMESTAMP))::date
  yesterday_start: (TIMEZONE('America/Lima', CURRENT_TIMESTAMP))::date - 1
  yesterday_end_exclusive: (TIMEZONE('America/Lima', CURRENT_TIMESTAMP))::date
  last_7_days_start: (TIMEZONE('America/Lima', CURRENT_TIMESTAMP))::date - 7
  last_30_days_start: (TIMEZONE('America/Lima', CURRENT_TIMESTAMP))::date - 30
  previous_closed_month_start: date_trunc('month', TIMEZONE('America/Lima', CURRENT_TIMESTAMP))::date - INTERVAL '1 month'
  previous_closed_month_end_exclusive: date_trunc('month', TIMEZONE('America/Lima', CURRENT_TIMESTAMP))::date
rules:
  - Apply a temporal predicate only when the user requests a period, the requested semantic metric
    defines one, or the business meaning cannot otherwise be answered faithfully.
  - Select the published date or timestamp member that matches the user's business meaning. When
    several date roles would produce materially different answers and context does not resolve them,
    ask one focused clarification question.
  - When a range is used, prefer unambiguous inclusive-lower and exclusive-upper boundaries and
    preserve the requested timezone or the catalog timezone.
  - Do not impose a default date column, a default lookback window, or a universal closed-period
    requirement on detail, ranking, or top-N requests.
