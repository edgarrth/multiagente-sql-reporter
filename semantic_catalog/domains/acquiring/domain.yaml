name: acquiring
version: 1.2.0
description: Métricas gobernadas de adquirencia, autorización, liquidación y contracargos.
aliases:
- adquirencia
- pagos
- merchants
- comercios
- transacciones
- autorizaciones
- contracargos
owner: Data & Analytics - Acquiring
allowed_sources:
- semantic.v_payment_transactions
- semantic.v_daily_payment_metrics
- semantic.v_merchant_performance
- semantic.v_merchant_settlement_metrics
- semantic.v_monthly_payment_metrics
- semantic.v_decline_analysis
- semantic.v_chargeback_metrics
query_policy:
  denied_schemas:
  - operational
  - analytics
  - raw
  - bronze
  - landing
  - information_schema
  - pg_catalog
  denied_functions:
  - pg_read_file
  - dblink
  - lo_import
  - lo_export
  reject_cross_joins: true
  maximum_rows: 500
  timezone: America/Lima
certification_rules:
- Use certified metric definitions when the request invokes a governed business metric; detail
  requests may project any published column allowed by the selected source contract.
- Exclude test transactions; semantic views already enforce this rule.
- Monetary amounts use PEN unless currency_code is explicitly selected.
- Select sources by requested grain, columns, relationships and certified definitions; do not force
  one view solely from a phrase or example query.
- Interpret settlement failures only as settlement_status = 'FAILED'; permitted settlement values
  are PENDING, SETTLED, FAILED and NOT_APPLICABLE.
data_classification:
  contains_pii: false
  contains_pci: false
  maximum_classification: internal
