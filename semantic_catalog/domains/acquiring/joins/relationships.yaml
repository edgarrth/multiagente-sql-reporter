relationships:
  - name: transaction_to_merchant
    source_entity: payment_transaction
    target_entity: merchant_performance
    cardinality: many_to_one
    join_keys: [merchant_id]
    approved: true
    notes: Prefer semantic aggregate views; use this relationship only when transaction detail is required.
  - name: transaction_to_chargeback
    source_entity: payment_transaction
    target_entity: chargeback_metrics
    cardinality: one_to_zero_or_many
    approved: false
    notes: The semantic chargeback view is already aggregated and must not be joined to transaction detail.
join_rules:
  - Never join two aggregate views unless their grains and grouping keys are explicitly aligned.
  - Never average approval_rate; recompute it from approved_count and transaction_count.
  - Reject cross joins and conditionless joins.
