name: merchant_performance
description: Desempeño diario certificado por comercio y atributos de segmentación.
source: semantic.v_merchant_performance
grain: Una fila por metric_date y merchant_id.
dimensions:
  - {name: metric_date, column: metric_date, type: date}
  - {name: merchant_id, column: merchant_id, type: integer}
  - {name: merchant_name, column: merchant_name, type: string}
  - {name: mcc, column: mcc, type: string}
  - {name: city, column: city, type: string}
  - {name: segment, column: segment, type: string}
  - {name: risk_level, column: risk_level, type: string}
measures:
  - {name: transaction_count, column: transaction_count, type: integer}
  - {name: approved_count, column: approved_count, type: integer}
  - {name: declined_count, column: declined_count, type: integer}
  - {name: processed_amount_pen, column: processed_amount_pen, type: decimal, format: currency}
  - {name: fee_revenue_pen, column: fee_revenue_pen, type: decimal, format: currency}
  - {name: approval_rate, column: approval_rate, type: decimal, format: percentage}
  - {name: average_ticket_pen, column: average_ticket_pen, type: decimal, format: currency}
