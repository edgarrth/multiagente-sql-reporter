[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "axiz-pe-sql-agent-poc"
version = "0.5.0"
description = "Config-driven multi-agent Text-to-SQL PoC for governed enterprise analytics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Axiz.pe"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "openai>=2.48,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "sqlglot>=25,<31",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5.2,<7",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "python-multipart>=0.0.20,<1",
  "structlog>=25,<26",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "XlsxWriter>=3.2,<4"
]

[project.optional-dependencies]
ui = ["streamlit>=1.52,<2"]
teams = [
  "aiohttp>=3.11,<4",
  "microsoft-agents-activity>=1.1,<2",
  "microsoft-agents-hosting-core>=1.1,<2",
  "microsoft-agents-hosting-fastapi>=0.8,<2",
  "microsoft-agents-authentication-msal>=1.1,<2"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6,<7"
]

[tool.hatch.build.targets.wheel]
packages = ["src/axiz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
