name: axiz-pe-sql-agent-poc
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: axiz_agent_control
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: app_owner
      TZ: America/Lima
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql
    - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p 5432 -U app_owner -d axiz_agent_control
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
  redis:
    image: redis:8-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: infrastructure/api.Dockerfile
    env_file:
    - ../.env
    environment:
      SEMANTIC_CATALOG_PATH: /app/semantic_catalog
      AGENT_MODELS_CONFIG_PATH: /app/config/agents.yaml
      DATABASE_URL: postgresql+psycopg://app_owner:app_owner@postgres:5432/axiz_agent_control
      CHECKPOINT_DATABASE_URL: postgresql://app_owner:app_owner@postgres:5432/axiz_agent_control
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://agent_reader:agent_readonly@postgres:5432/axiz_business_data}
      REDIS_URL: redis://redis:6379/0
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AGENT_DATABASE_CONNECT_TIMEOUT_SECONDS: ${AGENT_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')
      interval: 10s
      timeout: 5s
      retries: 20
    restart: on-failure:5
    volumes:
    - ./certs:/app/certs:ro
  streamlit:
    build:
      context: ..
      dockerfile: infrastructure/streamlit.Dockerfile
    environment:
      STREAMLIT_API_BASE_URL: http://api:8000
    ports:
    - 8501:8501
    depends_on:
      api:
        condition: service_healthy
  teams:
    profiles:
    - teams
    build:
      context: ..
      dockerfile: infrastructure/teams.Dockerfile
    env_file:
    - ../.env
    environment:
      API_BASE_URL: http://api:8000
      PORT: 3978
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID: ${TEAMS_BOT_ID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET: ${TEAMS_BOT_PASSWORD:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID: ${TEAMS_TENANT_ID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHENTICATIONTYPE: ClientSecret
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES__0: https://api.botframework.com/.default
      TOKENVALIDATION__ENABLED: 'true'
      TOKENVALIDATION__AUDIENCES__0: ${TEAMS_BOT_ID:-}
    ports:
    - 3978:3978
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data: null
  redis_data: null
