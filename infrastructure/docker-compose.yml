name: axiz-pe-sql-agent-poc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: axiz_sql_agent
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: app_owner
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d axiz_sql_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infrastructure/api.Dockerfile
    env_file:
      - ../.env
    environment:
      SEMANTIC_CATALOG_PATH: /app/semantic_catalog
      AGENT_MODELS_CONFIG_PATH: /app/config/agents.yaml
      DATABASE_URL: postgresql+psycopg://app_owner:app_owner@postgres:5432/axiz_sql_agent
      CHECKPOINT_DATABASE_URL: postgresql://app_owner:app_owner@postgres:5432/axiz_sql_agent
      AGENT_DATABASE_URL: postgresql://agent_reader:agent_readonly@postgres:5432/axiz_sql_agent
      REDIS_URL: redis://redis:6379/0
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 20

  streamlit:
    build:
      context: ..
      dockerfile: infrastructure/streamlit.Dockerfile
    environment:
      STREAMLIT_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  teams:
    profiles: ["teams"]
    build:
      context: ..
      dockerfile: infrastructure/teams.Dockerfile
    env_file:
      - ../.env
    environment:
      API_BASE_URL: http://api:8000
      PORT: 3978
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID: ${TEAMS_BOT_ID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET: ${TEAMS_BOT_PASSWORD:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID: ${TEAMS_TENANT_ID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHENTICATIONTYPE: ClientSecret
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES__0: https://api.botframework.com/.default
      TOKENVALIDATION__ENABLED: "true"
      TOKENVALIDATION__AUDIENCES__0: ${TEAMS_BOT_ID:-}
    ports:
      - "3978:3978"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
