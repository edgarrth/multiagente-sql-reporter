name: ${COMPOSE_PROJECT_NAME:-axiz-pe-sql-agent-poc}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    env_file:
      - ../.env
    command:
      - postgres
      - -c
      - port=${POSTGRES_PORT:-5432}
    environment:
      TZ: ${APP_TIMEZONE:-America/Lima}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -p "$${POSTGRES_PORT}"
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: ${POSTGRES_HEALTH_INTERVAL:-5s}
      timeout: ${POSTGRES_HEALTH_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTH_RETRIES:-60}
      start_period: ${POSTGRES_HEALTH_START_PERIOD:-10s}

  postgres-bootstrap:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/init:/bootstrap:ro
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap.sh
    restart: "no"

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    env_file:
      - ../.env
    command:
      - redis-server
      - --port
      - ${REDIS_PORT:-6379}
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -p "$${REDIS_PORT}" ping
      interval: ${REDIS_HEALTH_INTERVAL:-5s}
      timeout: ${REDIS_HEALTH_TIMEOUT:-3s}
      retries: ${REDIS_HEALTH_RETRIES:-20}

  api:
    build:
      context: ..
      dockerfile: infrastructure/api.Dockerfile
    env_file:
      - ../.env
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${API_HOST_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.environ['API_PORT'] + os.environ['API_HEALTH_PATH'])"
      interval: ${API_HEALTH_INTERVAL:-10s}
      timeout: ${API_HEALTH_TIMEOUT:-5s}
      retries: ${API_HEALTH_RETRIES:-20}
    restart: ${API_RESTART_POLICY:-on-failure:5}
    volumes:
      - ./certs:/app/certs:ro

  streamlit:
    build:
      context: ..
      dockerfile: infrastructure/streamlit.Dockerfile
    env_file:
      - ../.env
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    depends_on:
      api:
        condition: service_healthy

  teams:
    profiles:
      - teams
    build:
      context: ..
      dockerfile: infrastructure/teams.Dockerfile
    env_file:
      - ../.env
    environment:
      PORT: ${TEAMS_PORT:-3978}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID: ${TEAMS_BOT_ID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET: ${TEAMS_BOT_PASSWORD:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID: ${TEAMS_TENANT_ID:-}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHENTICATIONTYPE: ${TEAMS_AUTHENTICATION_TYPE:-ClientSecret}
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES__0: ${TEAMS_BOT_SCOPE:-https://api.botframework.com/.default}
      TOKENVALIDATION__ENABLED: ${TEAMS_TOKEN_VALIDATION_ENABLED:-true}
      TOKENVALIDATION__AUDIENCES__0: ${TEAMS_BOT_ID:-}
    ports:
      - "${TEAMS_HOST_PORT:-3978}:${TEAMS_PORT:-3978}"
    depends_on:
      api:
        condition: service_healthy
    restart: ${TEAMS_RESTART_POLICY:-unless-stopped}

volumes:
  postgres_data:
  redis_data:
